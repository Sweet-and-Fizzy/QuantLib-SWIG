name: Build Wheels

on:
  push:
    branches: [ svensson-fixed-params ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ svensson-fixed-params ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-20.04, windows-2019, macos-11]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libboost-all-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake boost

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        # Boost will be handled by vcpkg or pre-built

    - name: Clone and build QuantLib
      shell: bash
      run: |
        # Clone your QuantLib fork
        git clone https://github.com/Sweet-and-Fizzy/QuantLib.git ../QuantLib
        cd ../QuantLib
        git checkout svensson-fixed-params
        
        # Build QuantLib
        mkdir build && cd build
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cmake .. -DCMAKE_BUILD_TYPE=Release -A x64
          cmake --build . --config Release --parallel
          cmake --install . --config Release
        else
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          # Update library cache on Linux
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo ldconfig
          fi
        fi
        
        # Verify the installation includes our modifications
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          echo "Checking for SvenssonFitting constructor..."
          grep -n "SvenssonFitting.*fixedParameters" /usr/local/include/ql/termstructures/yield/nonlinearfittingmethods.hpp || echo "Constructor not found in headers"
          echo "Checking library installation..."
          ls -la /usr/local/lib/libQuantLib* || echo "QuantLib library not found"
          echo "Checking quantlib-config..."
          /usr/local/bin/quantlib-config --version || echo "quantlib-config not found"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==2.16.2

    - name: Build wheels
      working-directory: Python
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        # Build for Python 3.8-3.11 on all platforms
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-*
        # Skip 32-bit builds and musl for simplicity
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
        # Set C++ standard and ensure we use our custom QuantLib
        CIBW_ENVIRONMENT_LINUX: CXXFLAGS="-std=c++17" CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib"
        CIBW_ENVIRONMENT_MACOS: CXXFLAGS="-std=c++17" CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib"
        CIBW_ENVIRONMENT_WINDOWS: CXXFLAGS="/std:c++17"
        # The QuantLib build step above should have installed our custom version
        CIBW_BEFORE_BUILD_LINUX: |
          echo "Using pre-installed custom QuantLib"
          ls -la /usr/local/include/ql/termstructures/yield/
        CIBW_BEFORE_BUILD_MACOS: |
          echo "Using pre-installed custom QuantLib"
          ls -la /usr/local/include/ql/termstructures/yield/
        # Test the wheel
        CIBW_TEST_COMMAND: python -c "import QuantLib as ql; print(f'QuantLib {ql.__version__} installed successfully')"

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: Python/wheelhouse/*.whl

  create_release:
    name: Create Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v3
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          wheels-*/QuantLib-*.whl
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}