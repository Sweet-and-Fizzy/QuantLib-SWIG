name: Build Wheels

on:
  push:
    branches: [ svensson-fixed-params ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ svensson-fixed-params ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-20.04, macos-12]  # Ubuntu 20.04 has glibc 2.31, compatible with Deepnote

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Install build tools but NOT libquantlib-dev (we'll build our own)
        sudo apt-get install -y cmake build-essential libboost-all-dev autoconf automake libtool

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake boost autoconf automake libtool

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        # Install Boost using vcpkg
        git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        C:\vcpkg\vcpkg.exe install boost:x64-windows
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

    - name: Remove any existing QuantLib packages
      if: runner.os == 'Linux'
      run: |
        # Remove any system QuantLib packages that might conflict
        sudo apt-get remove -y libquantlib-dev libquantlib0v5 || true

    - name: Clone and build QuantLib
      shell: bash
      run: |
        # Clone your QuantLib fork
        git clone https://github.com/Sweet-and-Fizzy/QuantLib.git ../QuantLib
        cd ../QuantLib
        git checkout svensson-fixed-params
        
        # Build QuantLib
        mkdir build && cd build
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cmake .. -DCMAKE_BUILD_TYPE=Release -A x64 -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE"
          cmake --build . --config Release --parallel
          cmake --install . --config Release
        else
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          make -j$(nproc)
          sudo make install
          # Update library cache on Linux
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo ldconfig
          fi
        fi
        
        # Verify the installation includes our modifications
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          echo "=== Verification of custom QuantLib installation ==="
          echo "QuantLib version from quantlib-config:"
          /usr/local/bin/quantlib-config --version || echo "quantlib-config not found"
          echo "Checking for SvenssonFitting constructor..."
          grep -A 3 -B 1 "SvenssonFitting.*fixedParameters" /usr/local/include/ql/termstructures/yield/nonlinearfittingmethods.hpp || echo "Constructor not found in headers"
          echo "Library files:"
          ls -la /usr/local/lib/libQuantLib* || echo "QuantLib library not found"
          echo "Include directory:"
          ls -la /usr/local/include/ql/termstructures/yield/nonlinearfittingmethods.hpp || echo "Headers not found"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Configure build to use custom QuantLib
      shell: bash
      run: |
        # Ensure all builds use our custom QuantLib installation
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          # Update PKG_CONFIG_PATH to prioritize our installation
          echo "export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "export DYLD_LIBRARY_PATH=/usr/local/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          
          # Verify our quantlib-config is being used
          echo "=== Final verification before wheel building ==="
          which quantlib-config || echo "quantlib-config not in PATH"
          /usr/local/bin/quantlib-config --version || echo "Custom quantlib-config failed"
          quantlib-config --cflags || echo "quantlib-config --cflags failed"
          echo "Constructor check:"
          grep -n "fixedParameters" /usr/local/include/ql/termstructures/yield/nonlinearfittingmethods.hpp || echo "Constructor still not found!"
        fi

    - name: Install SWIG
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get install -y swig
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install swig
        fi

    - name: Generate SWIG wrappers
      run: |
        # Configure and generate SWIG wrappers
        ./autogen.sh
        ./configure --disable-perl --disable-ruby --disable-ocaml --disable-r --disable-java --disable-csharp --disable-scala
        make -C Python src/QuantLib/quantlib_wrap.cpp

    - name: Build wheels (Python only)
      working-directory: Python
      run: |
        # Build using regular setup.py to avoid cibuildwheel container isolation issues
        python -m pip install wheel
        
        # Disable Py_LIMITED_API for SWIG compatibility
        # The SWIG-generated code uses Python C API functions not available in Limited API
        sed -i 's/py_limited_api = platform.python_implementation()/py_limited_api = False/' setup.py || \
        sed -i '' 's/py_limited_api = platform.python_implementation()/py_limited_api = False/' setup.py
        
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CXXFLAGS="-std=c++17"
          export CPPFLAGS="-I/usr/local/include"
          export LDFLAGS="-L/usr/local/lib"
        fi
        python setup.py bdist_wheel
        mkdir -p wheelhouse
        cp dist/*.whl wheelhouse/

    - name: Repair wheels for better Linux compatibility
      if: runner.os == 'Linux'
      working-directory: Python
      run: |
        # Install auditwheel to create manylinux wheels
        python -m pip install auditwheel
        
        # Show original wheel info
        echo "=== Original wheel ==="
        ls -la wheelhouse/
        
        # Repair the wheel to bundle dependencies and create manylinux wheel
        echo "=== Analyzing wheel dependencies ==="
        auditwheel show wheelhouse/*.whl
        
        echo "=== Repairing wheel ==="
        # Try to repair wheel - Ubuntu 20.04 has glibc 2.31, so we can target manylinux_2_31
        # This should bundle libQuantLib.so into the wheel
        if auditwheel repair wheelhouse/*.whl -w wheelhouse_repaired/ --plat manylinux_2_31_x86_64; then
          echo "✅ Created manylinux_2_31 wheel (compatible with glibc 2.31+, including Deepnote)"
        elif auditwheel repair wheelhouse/*.whl -w wheelhouse_repaired/ --plat linux_x86_64; then
          echo "✅ Created linux_x86_64 wheel with bundled dependencies"
        else
          echo "⚠️ auditwheel repair failed - keeping original wheel"
          echo "Building on Ubuntu 20.04 should still make it compatible with Deepnote"
          mkdir -p wheelhouse_repaired
          cp wheelhouse/*.whl wheelhouse_repaired/
        fi
        
        # Replace original wheel with repaired version
        rm wheelhouse/*.whl
        cp wheelhouse_repaired/*.whl wheelhouse/
        
        echo "=== Repaired wheel ==="
        ls -la wheelhouse/

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: Python/wheelhouse/*.whl

  create_release:
    name: Create Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          wheels-*/QuantLib-*.whl
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}