name: Linux build
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: java
            config: -old
          - language: java
            config: -new
          - language: csharp
          - language: r
          - language: scala
    container: ghcr.io/lballabio/quantlib-swig-devenv:${{ matrix.language }}
    steps:
    - uses: actions/checkout@v5
    - name: Install custom QuantLib with fixed parameters
      run: |
        # Install build dependencies
        apt-get update && apt-get install -y git cmake build-essential
        
        # Clone and build YOUR custom QuantLib
        git clone https://github.com/Sweet-and-Fizzy/QuantLib.git /tmp/QuantLib
        cd /tmp/QuantLib && git checkout svensson-fixed-params
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc) && make install && ldconfig
        
        # Verify our custom constructor is available
        echo "Checking for fixed parameter constructor:"
        grep -n "fixedParameters" /usr/local/include/ql/termstructures/yield/nonlinearfittingmethods.hpp || echo "Constructor not found!"
        
    - name: Build
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.build
    - name: Install
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.install
    - name: Check
      run: |
        ./.ci/${{ matrix.language }}${{ matrix.config }}.check
        
    - name: Build Python wheel (if Python)
      if: matrix.language == 'python'
      run: |
        . .venv/bin/activate
        cd Python
        python setup.py bdist_wheel
        echo "=== Built wheels ==="
        ls -la dist/
        echo "=== Wheel contents ==="
        python -c "
import zipfile
import os
for f in os.listdir('dist/'):
    if f.endswith('.whl'):
        print(f'Contents of {f}:')
        with zipfile.ZipFile(f'dist/{f}', 'r') as z:
            for name in z.namelist()[:10]:
                print(f'  {name}')
        break
"
        
    - name: Upload Python wheels
      if: matrix.language == 'python'
      uses: actions/upload-artifact@v4
      with:
        name: python-wheels-custom-quantlib-glibc-2-31
        path: Python/dist/*.whl
